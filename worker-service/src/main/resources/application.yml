server:
  port: 8081

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3307/scheduler_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Custom worker settings
worker:
  name: ${WORKER_NAME:worker-node-1}
  concurrency: 10
  poll-interval-ms: 1000

logging:
  level:
    org.springframework: INFO
    com.scheduler: DEBUG
