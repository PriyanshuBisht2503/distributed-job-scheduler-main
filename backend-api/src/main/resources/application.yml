server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3307/scheduler_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# Security / JWT properties
jwt:
  secret: 9a4f2c8d3b7a1e5f8c6b4d2e0a7f5c3b1a9e7d5f3c1b8a6f4d2e0b8a6f4d2e0a
  expirationMs: 86400000 # 24 hours

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    com.scheduler: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
